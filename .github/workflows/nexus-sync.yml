name: Sync release to Nexus Mods

# Uploads the zip attached to a GitHub release to Nexus Mods as a new version of the mod's file.
# The mod isn't built here: the zip attached to the release is the one that's uploaded. That's
# either a release created by release.yml, or one published by hand.
#
# Setup (repo Settings > Secrets and variables > Actions):
#   secret   NEXUSMODS_API_KEY             from https://www.nexusmods.com/settings/api-keys
#   variable NEXUS_MOD_SYNC_CHECK_FILE_ID  the file ID shown under "Advanced" on the mod page's Files tab
# The mod page must already exist on Nexus Mods with a first file uploaded by hand.

on:
  release:
    types: [published]
  workflow_call: # from release.yml, for the releases it creates
    inputs:
      tag:
        type: string
        required: true
    secrets:
      NEXUSMODS_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (e.g. mod-sync-check-v1.0.2)
        required: true

permissions:
  contents: read

jobs:
  mod-sync-check:
    name: Upload Mod Sync Check
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    if: startsWith(github.event.release.tag_name || inputs.tag, 'mod-sync-check-v')
    steps:
      - name: Download the release zip
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'ModSyncCheck-*.zip' --dir release
          count=$(find release -name '*.zip' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected one ModSyncCheck-*.zip on release $TAG, found $count"
            exit 1
          fi
          echo "path=$(find release -name '*.zip')" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#mod-sync-check-v}" >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_MOD_SYNC_CHECK_FILE_ID }}
          filename: ${{ steps.zip.outputs.path }}
          version: ${{ steps.zip.outputs.version }}
          display_name: Mod Sync Check ${{ steps.zip.outputs.version }}
          archive_existing_version: true
          update_mod_version: true
